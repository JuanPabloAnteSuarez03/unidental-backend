[pytest]
DJANGO_SETTINGS_MODULE = unidental.settings
python_files = tests.py test_*.py *_tests.py

# Sobrescribir la configuración de la base de datos para los tests
# Esta es la forma robusta y estándar de hacerlo con pytest-django.
# Forzará a Django a usar una base de datos SQLite en memoria para todos los tests,
# ignorando por completo la configuración de PostgreSQL en settings.py.
DATABASES = {
    'default': {
        'ENGINE': 'django.db.backends.sqlite3',
        'NAME': ':memory:',
    }
}