name: Django CI

on:
  push:
    branches: [ "main" ] # Cambia "main" por tu rama principal si es diferente (ej. master)
  pull_request:
    branches: [ "main" ] # Cambia "main" por tu rama principal si es diferente

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Define aquí las variables de entorno que tu settings.py espera
      # Estas se tomarán de GitHub Secrets (ver paso 3)
      # DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }} # No es necesario si se usa SQLite para tests como en settings.py
      SECRET_KEY: ${{ secrets.SECRET_KEY_TEST }}
      DEBUG: "False" # Para tests, DEBUG debería ser False
      # Si necesitas ALLOWED_HOSTS para tus tests, puedes configurarlo aquí o en tus settings de test
      # ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10" # Especifica tu versión de Python

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        python manage.py test 