services:
    - type: web
      name: unidental-backend
      env: python
      buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
      startCommand: "gunicorn unidental.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --worker-connections 1000 --max-requests 1000 --max-requests-jitter 100 --timeout 120 --keep-alive 5 --preload"
      envVars:
          - key: DJANGO_SETTINGS_MODULE
            value: unidental.settings
          - key: PYTHONPATH
            value: .
          - key: PYTHONUNBUFFERED
            value: 1
          - key: DEBUG
            value: False
          - key: USE_SQLITE_FOR_TESTS
            value: False
