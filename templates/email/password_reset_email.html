<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - UNIDENTAL</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .button { background: #e74c3c; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦷 UNIDENTAL</h1>
        <p>Sistema de Gestión Dental</p>
    </div>
    
    <div class="content">
        <h2>¡Hola {{ user.username }}!</h2>
        
        <p>Hemos recibido una solicitud para restablecer tu contraseña.</p>
        
        <p>
            <a href="{{ protocol }}://{{ domain }}/{{ url }}" class="button">
                Restablecer Contraseña
            </a>
        </p>
        
        <p><strong>Tu usuario:</strong> {{ user.username }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        
        <p>Si no solicitaste este cambio, ignora este email.</p>
        
        <hr>
        <p>Saludos,<br>Equipo UNIDENTAL</p>
    </div>
</body>
</html>
